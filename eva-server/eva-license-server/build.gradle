apply plugin: "org.springframework.boot"

project.tasks.publish.enabled = false

jar {
    enabled = true
}
bootJar {
    mainClass = 'io.nerv.core.LicenseBooter'
}

description = """license"""

// 依赖配置
dependencies {
    // 使用undertow替代tomcat
    implementation(libs.web){
        exclude module: 'spring-boot-starter-tomcat'
    }
    implementation  libs.hutool,
                    libs.truelicense

}
