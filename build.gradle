plugins {
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.ben.manes.versions)
}

allprojects {
    group = 'org.pkaq'
    version = '1.1.3'
}

subprojects {
    apply plugin: 'java-library'
	apply plugin: 'maven-publish'
    apply plugin: 'signing'

    apply plugin: 'io.spring.dependency-management'

    // 统一 Boot BOM 的 Flyway 属性，避免数据库插件与 core 使用不同版本。
    ext['flyway.version'] = libs.versions.flyway.get()

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = '25'
        targetCompatibility = '25'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = "UTF-8"
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add("-parameters")

        options.compilerArgs += [
                "-Amapstruct.defaultComponentModel=spring",
                "-Amapstruct.suppressGeneratorTimestamp=true",
                "-Amapstruct.verbose=true"
        ]
    }

    test {
        useJUnitPlatform()
    }

    repositories {
        mavenLocal()
        maven {
            name = 'nexus'
            def nexusBaseUrl = providers.gradleProperty('nexusBaseUrl')
                    .getOrElse('http://dev.jm-sk.com:12081').replaceAll('/+$', '')
            url = uri("${nexusBaseUrl}/repository/maven-public/")
            allowInsecureProtocol = url.scheme == 'http'
            // 默认匿名下载；配置凭据时与发布仓库使用相同的用户级属性。
            if (providers.gradleProperty('nexusUsername').isPresent()
                    || providers.gradleProperty('nexusPassword').isPresent()) {
                credentials(PasswordCredentials)
            }
        }
        mavenCentral()
    }

    dependencies {
        implementation platform(libs.boot)
        implementation libs.lombok
        annotationProcessor libs.lombok

        implementation      libs.mapstruct
        annotationProcessor libs.mapstruct.processor

        testImplementation libs.test,
                           libs.webtest,
                           libs.security.test
        testRuntimeOnly libs.junit.platform.launcher

     }
}

