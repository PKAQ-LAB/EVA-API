import org.apache.tools.ant.filters.ReplaceTokens

apply plugin: "org.springframework.boot"

project.tasks.publish.enabled = false

jar {
    enabled = true
}

bootJar {
    mainClass = 'org.pkaq.WebBooter'
}

description = """web"""

compileJava.dependsOn(processResources)

processResources {
    println "==> Load configuration for $profile"
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from(sourceSets.main.resources.srcDirs) {
        filter(ReplaceTokens, tokens: [profile: profile])
    }
}

dependencies {

    testImplementation("io.zonky.test:embedded-postgres:2.2.2") {
        exclude group: "io.zonky.test.postgres", module: "embedded-postgres-binaries-darwin-amd64"
        exclude group: "io.zonky.test.postgres", module: "embedded-postgres-binaries-linux-amd64"
        exclude group: "io.zonky.test.postgres", module: "embedded-postgres-binaries-linux-amd64-alpine"
    }

    implementation     project(":eva-core:eva-core-common"),
                       project(":eva-core:eva-core-data-mybatis"),
                       project(":eva-web:eva-web-sys:eva-web-sys-service"),
                       project(":eva-web:eva-web-auth"),
                       libs.postgre

    implementation libs.web

    implementation libs.springdocui,
                   libs.prometheus,
                   libs.actuator,
                   libs.knife4j.ui

    if (project.hasProperty('dev')) {
        runtimeOnly libs.dev.tools
    }
}
